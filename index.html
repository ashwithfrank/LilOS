<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>LilOS</title>
<meta name="description" content="LilOS — a tiny operating system that lives entirely inside your browser tab." />
<meta name="theme-color" content="#0b0c11" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 21 7 21 17 12 22 3 17 3 7Z' fill='%237c6cff'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='white'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/login.css" />
<link rel="stylesheet" href="css/desktop.css" />
<link rel="stylesheet" href="css/windows.css" />
<link rel="stylesheet" href="css/apps.css" />
<link rel="stylesheet" href="css/themes.css" />
</head>
<body>

<!-- ==================== Login / boot screen ==================== -->
<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-orb o1"></div>
  <div class="login-orb o2"></div>
  <div class="login-orb o3"></div>

  <div class="login-card glass">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" stroke="#6c4fe0" stroke-width="1.5" fill="none"/>
        <circle cx="12" cy="12" r="3.4" fill="#6c4fe0"/>
      </svg>
    </div>
    <h1 class="login-title">LilOS</h1>
    <p class="login-sub">Web Edition</p>
    <div class="login-clock" id="login-clock">--:-- · --</div>
    <button class="login-btn" id="login-btn">Log In</button>
    <p class="login-hint">No account needed — everything stays on this device</p>
  </div>
</div>

<!-- ==================== Desktop ==================== -->
<div id="desktop">
  <div class="wallpaper" data-wallpaper="aurora"></div>
  <div id="desktop-icons"></div>
  <div id="window-layer"></div>
</div>

<!-- ==================== Taskbar ==================== -->
<div id="taskbar" class="glass">
  <button id="launcher-btn" class="taskbar-btn launcher-btn" title="Open launcher">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" fill="white"/></svg>
  </button>
  <div class="taskbar-sep"></div>
  <div id="taskbar-running" style="display:flex; gap:4px; align-items:center;"></div>
  <div class="taskbar-sep"></div>
  <button id="notif-btn" class="taskbar-btn" title="Notifications">🔔</button>
  <div id="taskbar-clock" title="Date &amp; time"></div>
</div>

<!-- ==================== Launcher ==================== -->
<div id="launcher" class="glass">
  <input id="launcher-search" class="field" type="text" placeholder="Search apps…" />

  <div>
    <div class="launcher-section-label">Recent</div>
    <div class="launcher-recent" id="launcher-recent"></div>
  </div>

  <div style="flex:1; min-height:0; display:flex; flex-direction:column; gap:8px;">
    <div class="launcher-section-label">All apps</div>
    <div id="launcher-grid"></div>
  </div>

  <div class="launcher-power-row">
    <button class="btn" id="power-lock">🔒 Log Out</button>
    <button class="btn" id="power-sleep">🌙 Sleep</button>
    <button class="btn" id="power-restart">🔁 Restart</button>
  </div>
</div>

<!-- ==================== Notification panel ==================== -->
<div id="notif-panel" class="glass">
  <div class="panel-head">
    <h3>Notifications</h3>
    <button class="btn" id="notif-clear">Clear all</button>
  </div>
  <div id="notif-list" class="scrollpane"></div>
</div>

<!-- ==================== Toasts ==================== -->
<div id="toast-stack"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
